<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@600;800&family=Poppins:wght@500;700;800&family=Tajawal:wght@400;500;700&display=swap');
:root{
  --bg:#FFFFFF;--surface:#FFFFFF;--ink:#14281D;--muted:#4C5F53;--line:#D5E3D0;
  --green:#1B6B3A;--deep:#0E4426;--on-green:#FFFFFF;--mint:#E7F3DF;--sun:#F2B632;--sun-ink:#2A1E00;--err:#B3261E;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1A13;--surface:#162419;--ink:#EAF3EC;--muted:#9FB3A5;--line:#2A3D31;--green:#3FAE6A;--on-green:#07210F;--mint:#1A2F22;--err:#FF9A92;}}
:root[data-theme="dark"]{--bg:#0E1A13;--surface:#162419;--ink:#EAF3EC;--muted:#9FB3A5;--line:#2A3D31;--green:#3FAE6A;--on-green:#07210F;--mint:#1A2F22;--err:#FF9A92}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.7 'Poppins','Tajawal',system-ui,sans-serif}
h1,h2,h3{margin:0;line-height:1.3;font-family:'Poppins','Cairo',sans-serif}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}
header{display:flex;align-items:center;gap:16px;padding:14px 0;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;margin-inline-end:auto}
.logo svg{width:46px;height:46px}
.logo b{display:block;font:800 27px/1.1 'Poppins',sans-serif;color:var(--green)}
.logo small{display:block;font-size:13px}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav a{padding:7px 14px;border-radius:999px;font-weight:700;font-size:15px}
nav a:hover{background:var(--mint)}
nav a.on{background:var(--green);color:var(--on-green)}
.btn{font:700 16px 'Poppins','Tajawal',sans-serif;border:2px solid var(--green);border-radius:999px;padding:9px 22px;cursor:pointer;background:var(--green);color:var(--on-green);display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .15s}
.btn:active{transform:scale(.97)}
.btn.out{background:transparent;color:var(--green)}
.btn.sun{background:var(--sun);border-color:var(--sun);color:var(--sun-ink)}
.btn.sm{padding:5px 16px;font-size:14px}
.btn:disabled{opacity:.65;cursor:default}
.hero{background:linear-gradient(260deg,var(--mint),transparent 70%);display:grid;grid-template-columns:1.1fr 1fr;gap:28px;align-items:center;padding:30px 0}
.hero h1{font-size:clamp(34px,5.4vw,58px);font-weight:800;color:var(--green)}
.hero h1 span{color:var(--ink);display:block}
.hero p{font-size:clamp(17px,2vw,20px);margin:16px 0 24px;max-width:30em}
.cta{display:flex;gap:12px;flex-wrap:wrap}
.pic{position:relative}
.pic img{width:100%;aspect-ratio:1/1;max-height:430px;object-fit:cover;border-radius:28px;border:6px solid var(--mint);display:block}
.badge{position:absolute;top:14px;inset-inline-end:-6px;background:var(--sun);color:#fff;border-radius:12px;padding:6px 12px;font:800 13px/1.2 'Poppins','Cairo',sans-serif;display:flex;align-items:center;gap:8px;box-shadow:0 6px 16px rgba(0,0,0,.2)}
.badge big{font-size:36px}
@media (prefers-reduced-motion:no-preference){.pic img{animation:rise .9s ease-out both}@keyframes rise{from{transform:translateY(22px);opacity:0}}}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:8px 0 6px}
.stat{background:var(--mint);border-radius:20px;padding:14px 18px;text-align:center}
.stat b{display:block;font:800 clamp(30px,5vw,44px)/1.1 'Poppins',sans-serif;color:var(--green)}
.stat span{font-size:15px;font-weight:700}
section.blk{padding:34px 0 6px}
section.blk h2{font-size:clamp(25px,4vw,34px);color:var(--green);margin-bottom:6px}
.sub{color:var(--muted);margin:0 0 18px}
.about{display:grid;grid-template-columns:1fr 280px;gap:24px;align-items:center;background:var(--mint);border-radius:24px;padding:24px}
.about img{width:100%;border-radius:18px;display:block}
.about p{margin:0 0 14px}
.tools{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:18px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:4px 16px;font:500 15px 'Poppins','Tajawal',sans-serif;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--green);color:var(--on-green);border-color:var(--green)}
.tools input{max-width:260px;margin-inline-start:auto}
.board{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(270px,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column}
.card img{width:100%;aspect-ratio:16/10;object-fit:cover;display:block}
.card.done img{filter:grayscale(.7)}
.card .in{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px;flex:1}
.card.done{background:var(--mint)}
.card h3{font-size:19px}
.card p{margin:0;color:var(--muted);font-size:15px}
.tag{align-self:flex-start;background:var(--mint);border-radius:8px;padding:0 10px;font-size:14px;font-weight:700}
.card .btn{margin-top:auto}
.empty{grid-column:1/-1;padding:26px;border:2px dashed var(--line);border-radius:18px;text-align:center;color:var(--muted)}
.how h2,.how .sub{text-align:center}
.steps{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;text-align:center}
.step{flex:1;font-size:15px;color:var(--muted)}
.step .ic{width:76px;height:76px;border-radius:50%;background:var(--mint);display:grid;place-items:center;font-size:36px;margin:0 auto 8px}
.step b{display:block;font:700 18px 'Poppins','Cairo',sans-serif;color:var(--ink)}
.step b i{font-style:normal;display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--green);color:var(--on-green);font-size:13px;margin-inline-end:8px}
.arrow{align-self:center;color:var(--green);font-size:26px}
[dir=rtl] .arrow{transform:scaleX(-1)}
form{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:22px;display:grid;grid-template-columns:1fr 1fr;gap:14px}
form .full{grid-column:1/-1}
label{display:grid;gap:6px;font-weight:700;font-size:15px}
input,select{font:400 16px 'Poppins','Tajawal',sans-serif;padding:10px 12px;border-radius:10px;border:2px solid var(--line);background:var(--bg);color:var(--ink);width:100%}
input[aria-invalid=true]{border-color:var(--err)}
.err{color:var(--err);font-weight:500;font-size:13.5px;min-height:1.2em}
.note{min-height:1.5em;margin:0;color:var(--green);font-weight:700}
.banner{margin:34px 0 18px;border-radius:22px;background:linear-gradient(100deg,#0E4426,#1B6B3A);color:#fff;display:flex;align-items:center;gap:22px;padding:24px 30px;flex-wrap:wrap}
.banner h2{font-size:clamp(23px,4vw,34px);font-weight:700;flex:1;min-width:220px}
.banner em{font-style:normal;color:#FFE23B;font-weight:800}
.banner .btn{background:transparent;border-color:#fff;color:#fff}
footer{background:var(--deep);color:#fff;border-radius:18px;padding:18px 26px;display:flex;gap:16px;align-items:center;flex-wrap:wrap;justify-content:space-between;margin:0 0 26px;font-size:15px}
footer .l{display:flex;align-items:center;gap:10px;font:800 24px 'Poppins',sans-serif}
footer .l svg{width:36px;height:36px}
footer button{background:none;border:0;color:#fff;opacity:.8;text-decoration:underline;cursor:pointer;font:inherit;font-size:14px}
#toast{position:fixed;inset-inline:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));max-width:440px;margin-inline:auto;background:var(--deep);color:#fff;padding:12px 18px;border-radius:14px;box-shadow:0 10px 28px rgba(0,0,0,.3);transform:translateY(140%);transition:transform .3s;z-index:20;text-align:center}
#toast.show{transform:none}
@media (max-width:860px){.hero,.about{grid-template-columns:1fr}form{grid-template-columns:1fr}.steps{flex-wrap:wrap}.tools input{max-width:none;margin:0;flex:1 1 100%}}
@media (max-width:560px){.arrow{display:none}.step{flex-basis:100%}.stats{gap:8px}.stat{padding:10px 6px}.stat span{font-size:13px}}
</style>

var $=function(s){return document.querySelector(s)},$$=function(s){return document.querySelectorAll(s)};
var lang="ar",filter="all",query="",items=[],nextId=100,KEY="foodlink_v4";
try{var sv=JSON.parse(localStorage.getItem(KEY)||"null");if(sv&&sv.items){items=sv.items;nextId=sv.nextId||100}var sl=localStorage.getItem("foodlink_lang");if(sl==="en"||sl==="ar")lang=sl}catch(e){}
if(!items.length)items=JSON.parse(JSON.stringify(SEED));
function save(){try{localStorage.setItem(KEY,JSON.stringify({items:items,nextId:nextId}))}catch(e){}}
function L(v){return typeof v==="string"?v:v[lang]}
function esc(s){var d=document.createElement("div");d.textContent=s;return d.innerHTML}
function tt(k){return T[lang][k]}
function toast(m){var t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(toast.h);toast.h=setTimeout(function(){t.classList.remove("show")},4500)}
function applyLang(){
  document.documentElement.lang=lang;document.documentElement.dir=lang==="ar"?"rtl":"ltr";
  $$("[data-i]").forEach(function(e){e.textContent=tt(e.dataset.i)});
  $$("[data-ph]").forEach(function(e){e.placeholder=tt(e.dataset.ph)});
  $(".badge span").innerHTML=tt("badge").replace("\n","<br>");
  $("#langBtn").textContent=tt("lang");$("#langBtn").setAttribute("lang",lang==="ar"?"en":"ar");
  document.title="FoodLink – "+tt("tagline");
  drawChips();draw();
}
function drawChips(){
  var c=$("#chips");c.innerHTML="";c.setAttribute("aria-label",tt("find_h"));
  ["all","cooked","bakery","produce","packaged"].forEach(function(k){
    var b=document.createElement("button");b.type="button";b.className="chip";b.textContent=tt(k);b.setAttribute("aria-pressed",String(k===filter));
    b.onclick=function(){filter=k;drawChips();draw()};c.appendChild(b);
  });
}
function countUp(el,to){
  var from=parseInt(el.textContent,10)||0;
  if(from===to||matchMedia("(prefers-reduced-motion:reduce)").matches){el.textContent=to;return}
  var t0=performance.now();(function s(t){var p=Math.min(1,(t-t0)/600);el.textContent=Math.round(from+(to-from)*p);if(p<1)requestAnimationFrame(s)})(t0);
}
function draw(){
  var meals=0,offers=0,areas={};
  items.forEach(function(i){if(i.taken)meals+=i.qty;else{offers++;areas[L(i.area).trim().toLowerCase()]=1}});
  countUp($("#sMeals"),meals);countUp($("#sOffers"),offers);countUp($("#sAreas"),Object.keys(areas).length);
  var q=query.trim().toLowerCase();
  var shown=items.filter(function(i){return(filter==="all"||i.type===filter)&&(!q||(L(i.what)+" "+L(i.area)+" "+L(i.who)).toLowerCase().indexOf(q)>-1)});
  var list=$("#list");
  if(!shown.length){list.innerHTML='<div class="empty">'+esc(tt("empty"))+'</div>';return}
  list.innerHTML=shown.map(function(i){
    return '<article class="card'+(i.taken?' done':'')+'"><img loading="lazy" src="'+(i.img||IMG[i.type])+'" alt="'+esc(L(i.what))+'"><div class="in"><span class="tag">'+esc(tt(i.type))+'</span><h3>'+esc(L(i.what))+'</h3>'+
    '<p>'+esc(tt("from"))+': '+esc(L(i.who))+'<br>'+i.qty+' '+esc(tt("meals"))+' · '+esc(L(i.area))+'<br>'+esc(tt("pickup"))+' '+esc(i.time)+'</p>'+
    '<button type="button" class="btn sm'+(i.taken?'':' sun')+'" data-id="'+i.id+'"'+(i.taken?' disabled':'')+'>'+esc(tt(i.taken?"claimed":"claim"))+'</button></div></article>';
  }).join("");
}
$("#list").addEventListener("click",function(e){
  var id=e.target.getAttribute&&e.target.getAttribute("data-id");if(!id)return;
  items.forEach(function(i){if(String(i.id)===id&&!i.taken){i.taken=true;toast(i.phone?tt("toast_p")+" "+i.phone:tt("toast"))}});
  save();draw();
});
$("#q").addEventListener("input",function(e){query=e.target.value;draw()});
$("#langBtn").onclick=function(){lang=lang==="ar"?"en":"ar";try{localStorage.setItem("foodlink_lang",lang)}catch(e){}applyLang()};
$("#reset").onclick=function(){items=JSON.parse(JSON.stringify(SEED));filter="all";query="";$("#q").value="";save();drawChips();draw()};
$("#form").addEventListener("submit",function(e){
  e.preventDefault();var f=e.target,v={},bad=false;
  ["who","what","type","qty","area","time","phone"].forEach(function(n){v[n]=f.elements[n].value.trim()});
  function setErr(n,k){var el=f.elements[n],s=el.parentNode.querySelector(".err");s.textContent=k?tt(k):"";el.setAttribute("aria-invalid",k?"true":"false");if(k&&!bad){bad=true;el.focus()}}
  setErr("who",v.who?"":"e_req");setErr("what",v.what?"":"e_req");setErr("area",v.area?"":"e_req");setErr("time",v.time?"":"e_req");
  var q=Number(v.qty);setErr("qty",(v.qty&&q>=1&&q<=500&&Math.floor(q)===q)?"":"e_qty");
  setErr("phone",(!v.phone||/^\+?[0-9\s-]{8,15}$/.test(v.phone))?"":"e_phone");
  if(bad){$("#note").textContent="";return}
  items.unshift({id:nextId++,who:v.who,what:v.what,type:v.type,qty:q,area:v.area,time:v.time,phone:v.phone,taken:false});
  filter="all";query="";$("#q").value="";save();drawChips();draw();f.reset();f.elements.qty.value=10;f.elements.time.value="20:00";
  $("#note").textContent=tt("ok");toast(tt("ok"));
});
var secs=["top","find","how","about","share"],links=$$("nav a");
window.addEventListener("scroll",function(){var y=scrollY+120,cur=0;secs.forEach(function(s,i){var el=document.getElementById(s);if(el&&el.offsetTop<=y)cur=i});links.forEach(function(a,i){a.classList.toggle("on",i===cur)})},{passive:true});
applyLang();
</script>
<script>
  const $a = (id) => document.getElementById(id);
  const msg = (t) => { $a("auth-msg").textContent = t; };

  function showState(user) {
    $a("auth-title").textContent = user ? "مسجل دخول: " + user.email : "تسجيل الدخول";
    $a("auth-email").style.display = user ? "none" : "block";
    $a("auth-pass").style.display = user ? "none" : "block";
    $a("btn-login").style.display = user ? "none" : "block";
    $a("btn-signup").style.display = user ? "none" : "block";
    $a("btn-logout").style.display = user ? "block" : "none";
  }

  $a("btn-signup").onclick = async () => {
    const { error } = await supa.auth.signUp({
      email: $a("auth-email").value.trim(),
      password: $a("auth-pass").value
    });
    msg(error ? "خطأ: " + error.message : "تم إنشاء الحساب");
  };

  $a("btn-login").onclick = async () => {
    const { data, error } = await supa.auth.signInWithPassword({
      email: $a("auth-email").value.trim(),
      password: $a("auth-pass").value
    });
    if (error) { msg("خطأ: " + error.message); return; }
    msg("تم تسجيل الدخول");
    showState(data.user);
  };

  $a("btn-logout").onclick = async () => {
    await supa.auth.signOut();
    msg("تم تسجيل الخروج");
    showState(null);
  };

  supa.auth.getSession().then(({ data }) => showState(data.session ? data.session.user : null));
</script>
